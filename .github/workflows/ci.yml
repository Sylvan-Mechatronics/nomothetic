name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # check: lint + type-check + tests (x86_64 Ubuntu, no Pi hardware)
  # ──────────────────────────────────────────────────────────────────────────
  check:
    name: Check (lint + type-check + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.10.9"

      - name: Cache uv virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras --no-extra pi --frozen

      - name: Lint — ruff
        run: uv run --no-sync ruff check src/ tests/

      - name: Lint — black
        run: uv run --no-sync black --check src/ tests/

      - name: Type check — mypy
        run: uv run --no-sync mypy src/ tests/

      - name: Tests — pytest
        run: uv run --no-sync pytest tests/ -v --cov=src/nomothetic --cov-report=term-missing

  # ──────────────────────────────────────────────────────────────────────────
  # release: create a GitHub Release when a vX.Y.Z tag is pushed
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
