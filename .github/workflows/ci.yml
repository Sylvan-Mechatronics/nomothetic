name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # check: lint + type-check + tests (x86_64 Ubuntu, no Pi hardware)
  # ──────────────────────────────────────────────────────────────────────────
  check:
    name: Check (lint + type-check + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"

      - name: Cache uv virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras --no-extra pi --frozen

      - name: Lint — ruff
        run: uv run --no-sync ruff check src/ tests/

      - name: Lint — black
        run: uv run --no-sync black --check src/ tests/

      - name: Type check — mypy
        run: uv run --no-sync mypy src/ tests/

      - name: Tests — pytest
        run: uv run --no-sync pytest tests/ -v --cov=src/nomothetic --cov-report=term-missing

  # ──────────────────────────────────────────────────────────────────────────
  # release: create a GitHub Release when a vX.Y.Z tag is pushed
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
